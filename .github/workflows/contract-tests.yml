name: Contract and container tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 and Docker contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt
            constraints.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Verify Linux-only dependency constraints
        run: >
          python -c "from importlib.metadata import version;
          expected = {'nvidia-nccl-cu13': '2.31.2', 'pexpect': '4.9.0', 'ptyprocess': '0.7.0'};
          actual = {name: version(name) for name in expected};
          assert actual == expected, f'{actual} != {expected}'"

      - name: Run synthetic contract tests
        run: python -m unittest -v test_store_sales_model.py test_evaluate_store_sales.py

      - name: Build the non-root runtime image
        run: docker build --target runtime --tag retail-sales-forecast-api:ci .

      - name: Verify the runtime image user
        run: >
          test "$(docker image inspect --format '{{.Config.User}}'
          retail-sales-forecast-api:ci)" = "retail"

      - name: Verify the runtime dependency boundary
        run: |
          docker run --rm retail-sales-forecast-api:ci python -m pip check
          docker run --rm retail-sales-forecast-api:ci python -c "import importlib.util; excluded = ['httpx', 'httpx2', 'ipykernel', 'kaggle', 'matplotlib']; assert all(importlib.util.find_spec(name) is None for name in excluded)"
          docker run --rm retail-sales-forecast-api:ci python -c "from importlib.metadata import version; assert version('nvidia-nccl-cu13') == '2.31.2'"

      - name: Build the private-data-free readiness image
        run: docker build --target ci-smoke --tag retail-sales-forecast-api:ci-smoke .

      - name: Start the readiness container
        run: >
          docker run --rm --detach --name retail-sales-forecast-ci
          --publish 127.0.0.1:8000:8000
          --env RETAIL_FORECAST_API_KEY=ci-smoke-key-1234567890-abcdef-1234567890
          --health-interval 2s --health-start-period 1s
          --health-timeout 10s --health-retries 20
          retail-sales-forecast-api:ci-smoke

      - name: Verify container readiness and process user
        shell: bash
        run: |
          for attempt in {1..30}; do
            health_status="$(docker inspect --format '{{.State.Health.Status}}' retail-sales-forecast-ci)"
            if [ "$health_status" = "healthy" ]; then
              break
            fi
            if [ "$health_status" = "unhealthy" ]; then
              docker logs retail-sales-forecast-ci
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' retail-sales-forecast-ci)" = "healthy"
          docker exec retail-sales-forecast-ci python -c "import os; assert os.getuid() != 0"
          curl --fail --silent http://127.0.0.1:8000/health | python -c "import json, sys; payload = json.load(sys.stdin); assert payload['status'] == 'ready'"

      - name: Show container logs after failure
        if: failure()
        run: docker logs retail-sales-forecast-ci || true

      - name: Stop the readiness container
        if: always()
        run: docker stop retail-sales-forecast-ci || true
